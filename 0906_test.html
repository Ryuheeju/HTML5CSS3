<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{margin: 0;padding: 0;}
        .wrap{
            width: 1000px;
            display: flex;
            margin: 0 auto;
            
        }
        .wrap p:nth-child(1) img{
            width: 100%;
            z-index: 2;
        }
        .txt{
            width: 100%;
            max-width: 1200px;
            top: 0;
            left: 0;
            position: absolute;
            overflow: hidden;
            /* filter: invert(100%); */
        }
        .txt p:nth-child(1){
            color: #fff;
            position: relative;
            left: 90%;
            font-size: 200px;
            font-weight: bold;
            z-index: 1;
        }
        .wrap p:nth-child(3){
            width: 100%;
            max-width: 1200px;
            position: absolute;
            left: 57%;
            font-size: 200px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <p><img src="./images/photo1.jpg" alt=""></p>
        <div class="txt">
            <p>ABCDE</p>
        </div>
        <p>ABCDE</p>
    </div>
</body>
</html>
