<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{margin: 0;padding: 0;}
        ul{list-style: none;}
        a{text-decoration: none;color: #333;}
        input[type="radio"]{display: none;}
        div{
            width: 100%;
            position: relative;
        }
        div p{
            width: 500px;
            height: 300px;
            position: absolute;
            left: 0;
            top: 0;
        }
        div p img{
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        #photo1:checked ~ div p:first-child img{
            display: block;
        }
        #photo2:checked ~ div p:nth-child(2) img{
            display: block;
        }
        #photo3:checked ~ div p:nth-child(3) img{
            display: block;
        }
        #photo4:checked ~ div p:nth-child(4) img{
            display: block;
        }
        #photo5:checked ~ div p:nth-child(5) img{
            display: block;
        }
        #photo6:checked ~ div p:nth-child(6) img{
            display: block;
        }
        label{
            display: block;
            width: calc(500px / 6);
            float: left;
            padding: 5px 10px;
            box-sizing: border-box;
            color: #565e65;
        }
        #photo1:checked ~ label:first-of-type,
        #photo2:checked ~ label:nth-of-type(2),
        #photo3:checked ~ label:nth-of-type(3),
        #photo4:checked ~ label:nth-of-type(4),
        #photo5:checked ~ label:nth-of-type(5),
        #photo6:checked ~ label:nth-of-type(6){
            color: #82dc28;
            font-weight: bold;
        }
    </style>
    
</head>
<body>
    <input type="radio" name="photo" id="photo1" checked><!--사용자가 클릭을 안해도 기본으로 떠있는 상태"checked"-->
    <input type="radio" name="photo" id="photo2">
    <input type="radio" name="photo" id="photo3">
    <input type="radio" name="photo" id="photo4">
    <div>
        <p>
            <p>01</p>
            <img src="https://corp.oliveyoung.com/img/tmp/tmp_img_platform1-cf428ca64855adc4a1062251b83cf683.jpg;jsessionid=7BC121942C23E39A4C49460695D7726B" alt="photo">
            <p>고객과 가장 가까운 곳에서<br>건강한 아름다움을 제안합니다.</p>
            <p>우리는 1,300여개의 매장을 기반으로 고객에게 뷰티&헬스 상품을 큐레이션합니다.<br>
                또한 체험형 콘텐츠와 커머스의 연계를 통해 파트너사들에게 매력적인 브랜딩, 마케팅 채널로 진화하고 있습니다.
            </p>
            <a href="#">올리브영 매장이 보고 싶다면?</a>
        </p>
        <p>
            <img src="https://corp.oliveyoung.com/img/tmp/tmp_img_platform2-777eecd5b0d28e7c17848bfe3dffe645.jpg;jsessionid=7BC121942C23E39A4C49460695D7726B" alt="photo">
        </p>
        <p>
            <img src="https://corp.oliveyoung.com/img/tmp/tmp_img_platform3-c78371c66bba75b227096ecd0f128e12.jpg;jsessionid=7BC121942C23E39A4C49460695D7726B" alt="photo">
        </p>
        <p>
            <img src="https://corp.oliveyoung.com/img/tmp/tmp_img_platform4-7c45898de0bdfb1de922247a126d8886.jpg;jsessionid=7BC121942C23E39A4C49460695D7726B" alt="photo">
        </p>
    </div>
    <label for="photo1">올리브영 매장</label>
    <label for="photo2">올리브영 Online(국내)</label>
    <label for="photo3">올리브영 글로벌</label>
    <label for="photo4">디플롯</label>
</body>
</html>
