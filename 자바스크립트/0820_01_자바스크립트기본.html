<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        /*function myFunction() {
          document.getElementById('demo').innerHTML = "Paragraph changed.";
        }/따옴표 "",'' 둘다 상관없음*/
        document.title="자바스크립트";
        console.log('123'+(123+123)+"\n"+"결합연산자");/*console.log는 디버깅할때 쓰임*/
        //+연산자--산술연산자(덧셈),결합연산자
        
    </script>
</head>
<body>
    <h2>Demo JavaScript in Head</h2>
    <p id="demo">A Paragraph</p>
    <button type="button" onclick="myFunction()">Try it</button>
    <script>
        function myFunction() {
            document.getElementById('demo').innerHTML = "Paragraph changed.";
        }/*따옴표 "",'' 둘다 상관없음*/
        document.body.style.background="#f00";//헤더에 들어가는 코드랑 바디에 들어가는 코드랑 나뉜다
    </script>
</body>
</html>
