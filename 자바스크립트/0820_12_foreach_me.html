<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #wrap{
            width: 100%;
            margin: 0 auto;
        }
        img{   
            position: absolute;
            width: 70%;
            top: 0;
            left: 200px;
        }
        .on{color: #000;}
        p{
            font-size: 28px;
            color: #ccc;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="con">
            <p class="txt">보도자료</p>
            <p class="txt">언론보도</p>
            <p class="txt">cjbs now</p>
            <p class="txt">미디어</p>
            <p class="txt">뉴스구독(E-MAIL)</p>
        </div>
        <div>
            <img src="./images/img1.JPG" alt="">
        </div>
    </div>
    <script>
        document.querySelectorAll(".txt")[0].classList.add("on");
        function myfnc(){
            document.querySelectorAll(".txt").forEach(function(keys,item){
                keys.classList.remove("on");
            }); 
        }
        document.querySelectorAll(".txt").forEach(function(keys,item){
            console.log(keys);
            keys.onclick=function(){
                myfnc();
                keys.classList.add("on");
                console.log(item);
                document.getElementsByTagName("img")[0].src="./images/img"+(item+1)+".JPG";
            }
        });
    </script>
</body>
</html>
