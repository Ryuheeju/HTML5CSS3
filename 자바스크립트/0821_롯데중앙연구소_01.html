<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{margin: 0;padding: 0;}
        ul{list-style: none;}
        a{
            text-decoration: none;
            color: rgba(255, 255, 255, 0.5);}
        .head{
            width: 1250px;
            margin: 0 auto;
        }
        .head ul{
            display: flex;
            justify-content: space-between;
            gap: 10px;
            text-align: center;
        }
        .head ul li{
            width: 100%;
            height: 100%;
            background-color: rgba(51, 51, 51, 0.8);
            padding: 15px 30px;
            border-radius: 50px;
        }
        .head ul li a{
            font-size: 18px;
            font-weight: bold;
        }
        .banner{
            margin-top: 100px;
            width: 100%;
            height: 300px;
        }
        .banner>.first{
            width: 100%;
            height: 100%;
            text-align: center;
            background-image: url(https://www.lotternd.com/assets/images/sub/research/research-ban1.jpg);
        }
        .banner>.first .txt{
            position: relative;
            top: 50%;
            transform: translateY(-50%);
        }
        .banner>.first .txt p:nth-child(1){
            font-size: 38px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .banner>.first .txt p:nth-child(2){
            font-size: 22px;
        }
    </style>
</head>
<body>
    <div class="head">
        <ul>
            <li>
                <a href="#">연구개발</a>
            </li>
            <li>
                <a href="#">기초연구</a>
            </li>
            <li>
                <a href="#">패키지연구</a>
            </li>
            <li>
                <a href="#">기술연구</a>
            </li>
            <li>
                <a href="#">안전관리</a>
            </li>
            <li>
                <a href="#">연구전략</a>
            </li>
        </ul>
    </div>
    <div class="banner">
        <div class="first">
            <div class="txt">
                <p>연구개발</p>
                <p>소비자의 니즈와 시장 선호도에 부합하는 신제품을 출시하고 품질을 개선합니다.</p>
            </div>
        </div>
    </div>
    <script>
        
    </script>
</body>

</html>
