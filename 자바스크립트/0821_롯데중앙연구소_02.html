<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<style>
        *{margin: 0;padding: 0;}
        ul{list-style: none;}
        a{
            text-decoration: none;
            color: rgba(255, 255, 255, 0.5);}
        div{
            margin-top: 100px;
            width: 100%;height: 350px;
            overflow: hidden;
        }
		div section{width: 100%;height: 350px;}
        .list{width: 70%;display: flex;margin: 20px auto;justify-content: space-between;}
        .list .txt{
            height: 100%;
            padding: 15px 0px;
        }
		.list .txt a{
			font-size: 20px;
			font-weight: bold;
            width: 100%;
            padding: 15px 60px;
            border-radius: 50px;
            color: rgba(255, 255, 255, 0.5);
            background-color: rgba(51, 51, 51, 0.8);
        }
        .list a.active{color: #fff;background: #da291c;}
		.on{display: block;}
	</style>
</head>
<body>
	<ul class="list">
        <li class="txt"><a href="#">연구개발</a></li>
        <li class="txt"><a href="#">기초연구</a></li>
        <li class="txt"><a href="#">패키지연구</a></li>
        <li class="txt"><a href="#">기술연구</a></li>
        <li class="txt"><a href="#">안전관리</a></li>
        <li class="txt"><a href="#">연구전략</a></li>
    </ul>
	<div>
		<section>
            <img src="https://www.lotternd.com/assets/images/sub/research/research-ban1.jpg" alt="">
        </section>
		<section>기초연구</section>
		<section>패키지연구</section>
		<section>기술연구</section>
		<section>안전관리</section>
		<section>연구전략</section>
	</div>
	<script>
		document.querySelectorAll(".txt")[0].firstChild.classList.add("active");
		document.querySelectorAll("section")[0].classList.add("on");
		function myfnc(){
			document.querySelectorAll(".txt").forEach(function(keys,item){
				keys.firstChild.classList.remove("active");
			});
		}
	  document.querySelectorAll(".txt").forEach(function(keys,item){
			console.log(keys);
			keys.onclick=function(e){
                e.preventDefault();
				myfnc();
				keys.firstChild.classList.add("active");
				console.log(item);
				document.querySelectorAll("section").forEach(function(value,key){
					value.classList.remove("on");
				})
				document.querySelectorAll("section")[item].classList.add("on");
			}
		});
	</script>
</body>
</html>
