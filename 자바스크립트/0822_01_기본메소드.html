<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        document.write('<h1 class="title">제목태그</h1>');/*따옴표가 안에있기때문에 밖에는 작은따옴표*/

        //window.alert("경고창입니다");/*윈도우 생략가능_alert("경고창입니다");*/

        //let test = window.confirm("자바스크립트가 재미있습니까?");/*확인과 취소가뜸_ok&cancel*/

        //window.prompt("당신의성별은?");/*입력필드*/
        let gender = window.prompt("당신의성별은?");/*입력필드*/

        let sum =prompt("당신의 총점은?");

        //let kor =prompt("국어점수입력");
        //let eng =prompt("영어점수입력");

        /*prompt를 숫자데이터로 바꾸는 방법*/
        let kor = Number(prompt("국어점수입력"));
        let eng =Number(prompt("영어점수입력"));
        document.write(kor + eng);/*prompt로 받은데이터는 숫자도 문자로 받는다*/

    </script>
