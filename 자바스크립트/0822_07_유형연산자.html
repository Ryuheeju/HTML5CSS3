<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        let a = 10;
        let b = "20";
        let c = String(30);
        document.write("a의 타입은 : ",typeof a,"<br>");//number:숫자

        document.write("b의 타입은 : ",typeof b,"<br>");//string:문자
        document.write("c의 타입은 : ",typeof c,"<br>");//string:문자

        document.write("10.33의 타입은 : ",typeof 10.33,"<br>");
        let d = Number("john");
        document.write(d+"<br>");//NaN "john"이라는 문자를 넘버로 바꿀수 없기때문에 이렇게 뜬다

        document.write(typeof parseFloat(123.4567)+"<br>");
        document.write(typeof parseFloat("123.4567")+"<br>");
        
        document.write(parseInt(123.4567)+"<br>");//소수점 이하를 버린다
        document.write(parseInt("123.4567")+"<br>");

        let x = "5";
        let y = +x;
        document.write(typeof y + "<br>");
        document.write( String(100 + 23)+"<br>");//문자로 바꾸는 메소드
        document.write((100 + 23).toString()+"<br>");//문자로 바꾸는 메소드

        let num1 = 5.345789;
        let num2 = 10000000;
        document.write(num1.toExponential(3)+"<br>");//소수점을 기준으로 세자리 나머지는 반올림되어서 지수형태
        document.write(num2.toExponential(3)+"<br>");//소수점을 기준으로 세자리 나머지는 지수형태
        document.write(num1.toFixed(3)+"<br>");//소수점을 기준으로 세자리 나머지 다 반올림
        document.write(num2.toFixed(3)+"<br>");//소수점을 기준으로 세자리 ?
        document.write(num1.toPrecision(3)+"<br>");//소수점상관없이 세자리 나머지 반올림
        document.write(num2.toPrecision(3)+"<br>");//소수점상관없이 세자리 나머지 지수

    </script>
</body>
</html>
