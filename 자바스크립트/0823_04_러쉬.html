<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{margin: 0;padding: 0;}
        ul{list-style: none;}
        #wrap{
            width: 100%;
            height: 720px;
            background: #fff;
        }
        /* #wrap.on{
            background: #fff;
        } */
        ul.cont{
            margin: 0 auto;
            width: 894px;
            display: flex;
            gap: 94px 177px;
            flex-wrap: wrap;   
            position: relative;
            top: 50%;
            transform: translateY(-50%);
        }
        ul li{
            width: 180px;
            height: 180px;
            background-color: rgb(34, 34, 34);
            border-radius: 50%;
            display: flex;
            align-items: center;
        }
        ul li.on{
            background-color: red;
        }
        ul li>p{
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div id="wrap">
        <ul class="cont">
            <li><p><img src="./images/ico_main_value01.svg" alt="img"></p></li>
            <li><p><img src="./images/ico_main_value02.svg" alt="img"></p></li>
            <li><p><img src="./images/ico_main_value03.svg" alt="img"></p></li>
            <li><p><img src="./images/ico_main_value04.svg" alt="img"></p></li>
            <li><p><img src="./images/ico_main_value05.svg" alt="img"></p></li>
            <li><p><img src="./images/ico_main_value06.svg" alt="img"></p></li>
        </ul>
    </div>
    <script>
        let bg =document.querySelector("#wrap ul li");
        bg.forEach(function(value,key){
            value.onmouseenter=function(){
                document.querySelector("#wrap ul li").style.backgroundColor="#ddd;"
            }
            value.onmouseleave=function(){
                document.querySelector("#wrap ul li").style.backgroundColor="#eee;"
            }
        })

    </script>
</body>
</html>
