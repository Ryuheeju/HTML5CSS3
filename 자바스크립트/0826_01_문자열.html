<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        let str =new String("nice to meet you");
        let str1 ="nice to meet you";
        document.write(str.search("m")+"<br>");
        document.write(str.search("M")+"<br>");/*내가찾고자하는 문자가 없으면 -1*/
        document.write(str.search(/M/i)+"<br>");/*대소문자구분없이 찾음*/
        document.write(str.replace("nice","happy")+"<br>");/*nice라는 문자를 찾아서 happy로바꾼다,대소문자 구분함...*/
        document.write(str.replace(/Nice/i,"happy")+"<br>");/*정규화하면 대소문자 구분없음,/Nice/i : 첫번째 단어 바꿔줌,/Nice/g : 모든 단어 바꿔줌,/Nice/gi : 대소문자구분없이 전부 바꿔줌 */
        document.write(str+"<br>")

        let str2 ="Mr Blue has a blue house and a blue car.";
        document.write(str2.replace("blue","red")+"<br>");///blue/i : 첫번째나오는 단어 바꿔줌
        document.write(str2.replace(/blue/g,"red")+"<br>");///blue/g : 소문자 blue를 모두 red 대체
        document.write(str2.replace(/blue/gi,"red")+"<br>");///blue/gi : 대소문자 구분없이 blue를 모두 red로 대체
        document.write(str2.replaceAll("blue","red")+"<br>");
        document.write(str2.indexOf("Blue")+"<br>");//앞에서부터
        document.write(str2.lastIndexOf("Blue")+"<br>");//뒤에서 가장먼저있는 B를 셈,카운팅은 앞에서...
        document.write(str2.match("blue")+"<br>");//
        document.write(str2.match("red")+"<br>");//문자가 없으면null
        document.write(str2.charAt(3)+"<br>");//해당인덱스 번호의 문자추출
        document.write(str2.slice(1,4)+"<br>");//1~3번까지 문자추출
        document.write(str2.slice(-5)+"<br>");//뒤에서부터 카운트하고 추출
        document.write(str2.slice(-4,-3)+"<br>");//뒤에서부터 카운트하고 추출
        document.write(str2.slice(1)+"<br>");//뒤에서부터 카운트하고 추출

        document.write(str2.split(" ",2)+"<br>")//"여기문자"를 기준으로 분리?
        document.write(str2.split(" ").length+"<br>")//"여기문자"을 기준으로 분리가 되어져 있는지...?
        document.write(str2.split(" ")[2]+"<br>")//?

        let str3 ="123456-1234567";
        document.write(str3.replace(str3.slice(7),"*******")+"<br>");
        document.write(str3.substring(7,8)+"<br>");//7~7번까지 문자 추출 단,뒤에서부터는 못가져옴(음의 값 불가)
        document.write(str3.substring(-2,-2)+"<br>");//음의 값 불가 0으로 처리
        document.write(str3.substr(0,6)+"<br>");//시작하는숫자,몇개를가져올지
        document.write(str3.substr(6)+"<br>");//스타트번호부터 끝까지
        document.write(str3.substr(-6)+"<br>");//뒤에서부터 카운팅해서 나머지 다 가져옴
        document.write(str3.length+"<br>");//총글자수
        document.write("*".repeat(7)+"<br>")//앞 문자를 몇번 반복해서 보여줄지...

        
        
    </script>
</body>
</html>
