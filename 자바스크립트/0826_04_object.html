    <script>
        const student = new Object();
        student.name = "홍길동";
        student.kor = 90;
        student.eng = 70;
        student.math = 40;
        student.sum = student.kor+student.eng+student.math;
        student.avg =(student.sum / 3).toFixed(2)
        document.write(student.sum+"<br>")//총점수
        document.write(student.avg+"<br>");
        document.write(student.name+"님의 국어점수는"+student.kor+"이고 영어점수는 "+student.eng+"점이고 수학점수는 "+student.math+"이고 총점은"+student.sum+"점 이고 평균은 "+"점 입니다.<br>");
        document.write(typeof student +"<br>")
