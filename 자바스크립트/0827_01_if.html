<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        let hour = 20;
        let greeting = ""

        if (hour == 20) {greeting = "Good day";}/*참*/
        else{greeting = "Bad day";}/*거짓*/
        //if (hour < 20) {greeting = "Good day";}/*참*/
        //else{greeting = "Bad day";}/*거짓*/
        document.write(`${greeting}<br>`)


        if(hour == 20) {
            greeting = "hour의 변수값은 20입니다.";
            hour = 10;
        }
        document.write(`${greeting}<br>`)
        document.write(`${hour}<br>`)

        if(hour == 10) greeting = "hour의 변수값은 20입니다.";/*조건을만족하는 참인 실행문이 하나면 중가로{} 생략*/
        document.write(`${greeting}<br>`)
    </script>
</body>
</html>
