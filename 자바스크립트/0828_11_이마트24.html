<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{margin: 0;padding: 0;}
        ul{list-style: none;}
        ul.list{
            width: 95%;
            max-width: 1124px;
            margin: 50px auto;
        }
        ul.list li{
            border-bottom: 1px solid;
        }
        ul.list .title{
            height: 95px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        ul.list .title h2.on{
            filter: invert(60%) sepia(98%) saturate(1078%) hue-rotate(348deg) brightness(101%) contrast(100%);
        }
        ul.list .title h2 img{
            height: 36px;
        }
        ul.list .title h2 img.on{
        }
        ul.list .title h2 img:hover{
            filter: invert(60%) sepia(98%) saturate(1078%) hue-rotate(348deg) brightness(101%) contrast(100%);
        }
        ul.list .title span{
            position: relative;
            width: 23px;
            display: block;
        }
        ul.list .title span::before,
        ul.list .title span::after{
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            background: #000;
            /*transition: 0.2s linear;*/
        }
        ul.list .title span::before{
            width: 20px;
            height: 3px;
            margin: -1px 0 0 -25px;
            rotate: 48deg;
        }
        ul.list .title span::after{
            width: 3px;
            height: 20px;
            margin: -10px 0 0 -5px;
            rotate: 40deg;
        }
        ul.list .title span.on::after{
            opacity: 0;
        }
        ul.list .title span.on::before{
            width: 30px;
            rotate: -1deg;
        }
        ul.list .contents{
            height: 0;
            width: 80%;
            overflow: hidden;
            position: relative;
            text-align: right;
            /*transition: 0.5s;*/
        }
        ul.list .contents p{
            transform: translateY(-20px);
            opacity: 0;
            font-size: 20px;
            line-height: 40px;
            /*transition: 1.2s;*/
        }
        ul.list .contents p > strong{
            font-size: 20px;
            font-weight: bold;
        }
        ul.list .contents p > span{
            color: #626364;
        }
        ul.list .contents p.on{
            transform: translateY(0px);
            opacity: 1;
        }
        ul.list .contents.on{
            height: 150px;
            
        }


    </style>
</head>
<body>
    <ul class="list">
        <li>
            <div class="title">
                <h2><img src="https://emart24.co.kr/assets/assets/imgs/brandStory/2023.png" alt=""></h2>
                <span></span>
            </div>
            <div class="contents">
                <p><strong>3월</strong> - 상품전시회 "딜리셔스 페스티벌" 개최<br><span>*3/8(수) ~ 10(금), 서울 양재 AT센터</span></p>
            </div>
        </li>
        <li>
            <div class="title">
                <h2><img src="https://emart24.co.kr/assets/assets/imgs/brandStory/2022.png" alt=""></h2>
                <span></span>
            </div>
            <div class="contents">
                <p><strong>3월</strong> - 상품전시회 "딜리셔스 페스티벌" 개최<br><span>*3/8(수) ~ 10(금), 서울 양재 AT센터</span></p>
            </div>
        </li>
        <li>
            <div class="title">
                <h2><img src="https://emart24.co.kr/assets/assets/imgs/brandStory/2021.png" alt=""></h2>
                <span></span>
            </div>
            <div class="contents">
                <p><strong>3월</strong> - 상품전시회 "딜리셔스 페스티벌" 개최<br><span>*3/8(수) ~ 10(금), 서울 양재 AT센터</span></p>
            </div>
        </li>
    </ul>
    <script>
        let listItem = document.querySelectorAll(".list li");
        function myfnc(){
            let bool = this.querySelector("span").classList.contains("on");
            console.log(bool)
            listItem.forEach(function(v,k){
            v.querySelector("span").classList.remove("on");
            v.querySelector(".contents").classList.remove("on");
            v.querySelector(".contents p").classList.remove("on");
            v.querySelector("ul.list .title h2").classList.remove("on");
            })
            if(!bool){
                this.querySelector("span").classList.add("on");
                this.querySelector(".contents").classList.add("on");
                this.querySelector(".contents p").classList.add("on");
                this.querySelector("ul.list .title h2").classList.add("on");
            }
            }

        listItem.forEach(function(v,k){
            v.onclick=myfnc;
        })
    </script>
</body>
</html>
