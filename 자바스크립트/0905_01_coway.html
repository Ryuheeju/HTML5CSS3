<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <title>Swiper demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1" />
  <!-- Link Swiper's CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

  <!-- Demo styles -->
  <style>
    html,
    body {
      position: relative;
      height: 100%;
    }

    body {
      background: #eee;
      font-family: Helvetica Neue, Helvetica, Arial, sans-serif;
      font-size: 14px;
      color: #000;
      margin: 0;
      padding: 0;
    }
    .txt{
        position: absolute;
        color: #fff;
        text-align: left;
        bottom: 100px;
        left: 300px;
        z-index: 1;
    }
    .txt h1{
        font-size: 65px;
        animation: up 2.5s forwards;
        margin-bottom: 30px;
    }
    .txt p{
        font-size: 28px;
        animation: up 2.5s forwards;
    }

    .swiper {
      width: 100%;
      height: 100%;
    }

    .swiper-slide {
      text-align: center;
      font-size: 18px;
      background: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .swiper-slide>img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: relative;
      animation: hi 3s forwards infinite;
    }
    @keyframes up {
            0%{opacity: 0;transform: translateY(20px);}
            100%{opacity: 1;transform: translateY(0);}
    }
    @keyframes hi {
            0%{transform: scale(100%)}
            100%{transform: scale(105%)}
    }
    .mySwiper .swiper-pagination-bullet {
      width: 20px;
      height: 20px;
      text-align: center;
      line-height: 20px;
      font-size: 12px;
      color: #000;
      opacity: 1;
      background: rgba(255, 255, 255, 0.8);
    }
    .mySwiper .swiper-pagination-bullet-active {
      color: #fff;
      background: #007aff;
    }
    .mySwiper .autoplay-progress {
      position: absolute;
      left: 300px;
      bottom: 16px;
      z-index: 10;
      width: 75px;
      height: 75px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #fff;
    }

    .mySwiper .autoplay-progress svg {
      --progress: 0;
      position: absolute;
      left: 0;
      top: 0px;
      z-index: 10;
      width: 100%;
      height: 100%;
      stroke-width: 3px;
      stroke: #fff;
      fill: none;
      stroke-dashoffset: calc(125.6px * (1 - var(--progress)));
      stroke-dasharray: 125.6;
      transform: rotate(-90deg);
    }
  </style>
</head>

<body>
  <!-- Swiper -->
  <div class="swiper mySwiper">
    <div class="swiper-wrapper">
      <div class="swiper-slide">
        <div class="txt">
            <h1>Company caring<br>for better Earth</h1>
            <p>코웨이가 더 나은 지구를 만들어 나가겠습니다.</p>
        </div>
        <img src="https://sustainability.coway.co.kr/images/main/visual-slide-1.jpg" alt="photo1">
    </div>
      <div class="swiper-slide">
        <div class="txt">
            <h1>Company caring<br>for better Earth</h1>
            <p>코웨이가 더 나은 지구를 만들어 나가겠습니다.</p>
        </div>
        <img src="https://sustainability.coway.co.kr/images/main/visual-slide-2.jpg" alt="photo2">
    </div>
    <div class="swiper-slide">
        <div class="txt">
            <h1>Company caring<br>for better Earth</h1>
            <p>코웨이가 더 나은 지구를 만들어 나가겠습니다.</p>
        </div>
        <img src="https://sustainability.coway.co.kr/images/main/visual-slide-3.jpg" alt="photo3">
    </div>
    <div class="swiper-slide">
        <div class="txt">
            <h1>Company caring<br>for better Earth</h1>
            <p>코웨이가 더 나은 지구를 만들어 나가겠습니다.</p>
        </div>
        <img src="https://sustainability.coway.co.kr/images/main/visual-slide-4.jpg" alt="photo3">
    </div>
    <div class="swiper-slide">
        <div class="txt">
            <h1>Company caring<br>for better Earth</h1>
            <p>코웨이가 더 나은 지구를 만들어 나가겠습니다.</p>
        </div>
        <img src="https://sustainability.coway.co.kr/images/main/visual-slide-5.jpg" alt="photo3">
    </div>
    </div>
    <div class="autoplay-progress">
      <svg viewBox="0 0 48 48">
        <circle cx="24" cy="24" r="20"></circle>
      </svg>
      <span></span>
    </div>
  </div>

  <!-- Swiper JS -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

  <!-- Initialize Swiper -->
  <script>
    const progressCircle = document.querySelector(".autoplay-progress svg");
    const progressContent = document.querySelector(".autoplay-progress span");
    var swiper = new Swiper(".mySwiper", {
      effect: "fade",
      loop: true,
      pagination: {
        el: ".swiper-pagination",
        clickable: true,
        renderBullet: function (index, className) {
          return '<span class="' + className + '">' + (index + 1) + "</span>";
        },
      },
      autoplay: {
        delay: 2500,
        disableOnInteraction: false,
        pauseOnMouseEnter: true,
      },
      on: {
        autoplayTimeLeft(s, time, progress) {
          progressCircle.style.setProperty("--progress", 1 - progress);
          progressContent.textContent = `${Math.ceil(time / 1000)}s`;
        }
      }
    });
    swiper.on('slideChange', function () {
    console.log('slide changed');
    });
    
  </script>
</body>

</html>
