<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{margin: 0;padding: 0;}
        ul{list-style: none;}
        a{text-decoration: none;color: #333;}
        .btn{width: 1200px;margin: 0 auto;display: flex;justify-content: center;gap: 12px;}
        .btn li a{
            display: block;
            padding: 0 16px;
            line-height: 44px;
            background-color: #fff;/*서식이바뀔거라 bgc로...*/
            border: 1px solid #ccc;
            font-size: 14px;
        }
        .btn li a.on{
            background-color: #211955;
            color: #fff;
            border-color:#211955;
        }
    </style>
</head>
<body>
    <ul class="btn">
        <li><a href="#" class="on">ELLE</a></li>
        <li><a href="#">COSMOPOLITAN</a></li>
        <li><a href="#">Harper’s BAZAAR</a></li>
        <li><a href="#">ESQUIRE</a></li>
        <li><a href="#">STUDIO DOT</a></li>
        <li><a href="#">YEET</a></li>
    </ul>
    <div class="contents">
        <p class="title"></p>
        <p class="visual"></p>
    </div>
</body>
</html>
