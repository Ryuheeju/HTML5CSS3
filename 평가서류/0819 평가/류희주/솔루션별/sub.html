<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css");
        *{margin: 0;padding: 0;}
        br{display: none;}
        #wrap{
            width: 100%;
            margin: 50px auto;
        }
       .top{
            width: 100%;
            max-width: 1200px;
            margin: 0 auto 100px;
        }
        .con{
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
        }
        .con .cont01{
            width: 100%;
            background: red;
        }
        .con .cont01 .imgbox{
            width: 100%;
            margin: 0 auto;
            background: yellow;
            /* display: flex;
            position: relative;
            background: yellow;
            flex-direction: row-reverse; */
        }
        .con .cont01 .imgbox>p{
            width: 1560px;
            padding-left: 300px;
            margin: 0 auto;
        }
        .con .cont01 .imgbox>p img{
            width: 100%;
        }
        .con .cont01 .txt{
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            background: blue;
        }
    </style>
</head>
<body>
    <div id="wrap">
        <div class="top">
            <p>솔루션별</p>
            <p>자동차, 전기전자, 산업재까지 다양한 분야에서 적용되고 있는<br class="laptop">
                BGF에코머티리얼즈의 솔루션을 소개합니다.</p>
        </div>
        <div class="con">
            <div class="cont01">
                <div class="imgbox">
                    <p><img src="https://www.bgfecomaterials.com/resources/kr/images/product/solution/contents_01.jpg" alt="img1"></p>
                </div>
                <div class="txt">
                    <p>Automotive</p>
                    <p>탄소저감과 지속 가능성을 고려하여 혁신적인 자동차 제품을 실현하는데 주력하고 있습니다.</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
